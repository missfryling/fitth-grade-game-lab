
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skyler's Christmas Keyboard Maze</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap');
*{box-sizing:border-box}
body{margin:0;background:#071b32;color:white;font-family:Fredoka,Arial;overflow:hidden}
#app{height:100dvh;display:flex;flex-direction:column;background:radial-gradient(ellipse at top,#19466b,#07172c 75%)}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 14px;flex-wrap:wrap}
h1{font-size:clamp(16px,2.7vw,26px);margin:0;color:#d8f4ff}
#stats{display:flex;gap:6px;flex-wrap:wrap}
.pill{background:#163c5b;border:1px solid #b9eaff55;border-radius:12px;padding:6px 10px;font-weight:700;font-size:13px}
#toolbar{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;padding:3px 8px}
button,input,select{font:600 15px Fredoka;border:0;border-radius:11px;padding:9px 13px}
button{background:#d5f2ff;color:#12324c;cursor:pointer}
button.secondary{background:#285778;color:white;border:1px solid #ffffff44}
button:active{transform:scale(.97)}
#stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:7px}
canvas{display:block;max-width:100%;max-height:100%;border-radius:17px;border:2px solid #a9e5ff77;box-shadow:0 10px 35px #0008;touch-action:none}
#touch{display:flex;justify-content:center;align-items:center;gap:9px;padding:5px 10px 8px}
#touch button{width:52px;height:42px;font-size:21px;padding:0;background:#c9edff}
#touch .middle{display:flex;flex-direction:column;gap:3px}
#touch .middle button{height:34px}
#footer{font-size:11px;text-align:center;color:#b7d8ee;padding:0 5px 5px}
#modal{position:fixed;inset:0;background:#031326dd;display:none;align-items:center;justify-content:center;padding:15px;z-index:5}
#box{width:min(500px,96vw);max-height:90vh;overflow:auto;background:linear-gradient(145deg,#17476b,#102b4a);border:2px solid #bdeaff77;border-radius:22px;padding:23px;box-shadow:0 15px 55px #000b}
#box h2{color:#d5f4ff;margin:0 0 12px;font-size:28px}
#box p{line-height:1.45;color:#e0f2ff}
.field{display:flex;flex-direction:column;gap:5px;margin:12px 0}
.field label{font-weight:600;color:#c5edff}
.field input,.field select{width:100%;background:#f1faff;color:#17334b}
#box button{margin:5px}
.small{font-size:12px;color:#bfe5f8}
@media(max-height:650px){header{padding:5px 9px}#toolbar{padding:1px}#touch{padding:2px 8px}#touch button{height:34px}#touch .middle button{height:28px}}
</style>
</head>
<body>
<div id="app">
<header>
 <h1>🎄 SKYLER'S CHRISTMAS KEYBOARD MAZE ❄️</h1>
 <div id="stats">
  <div class="pill" id="world">🎁 Winter Wonderland</div>
  <div class="pill" id="level">Level 1 / 50</div>
  <div class="pill">👣 Steps: <span id="steps">0</span></div>
  <div class="pill">🎅 Santas: <span id="santas">0</span></div>
  <div class="pill">🙂 <span id="playerName">Player</span></div>
 </div>
</header>
<div id="toolbar">
 <button id="settingsBtn" class="secondary">⚙️ Settings</button>
 <button id="newBtn" class="secondary">↻ Restart Maze</button>
 <button id="pauseBtn" class="secondary">Ⅱ Pause</button>
 <button id="fullBtn" class="secondary">⛶ Fullscreen</button>
</div>
<div id="stage"><canvas id="maze" width="1000" height="700"></canvas></div>
<div id="touch">
 <button data-dir="left">⬅️</button>
 <div class="middle">
  <button data-dir="up">⬆️</button>
  <button data-dir="down">⬇️</button>
 </div>
 <button data-dir="right">➡️</button>
</div>
<div id="footer">Use WASD, arrow keys, or the buttons. Collect Santa coins 🎅 and reach the glowing Christmas tree exit! Every move counts as a step.</div>
</div>

<div id="modal"><div id="box"></div></div>

<script>
(()=>{
'use strict';

const canvas=document.getElementById('maze');
const ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);

const worldNames=[
 'Winter Wonderland','Candy Cane Kingdom','Gingerbread Village',
 'Frosty Forest','Reindeer Ridge','North Pole Express',
 'Snowflake Summit','Peppermint Planet','Jingle Bell Junction',
 'Icicle Island','Christmas Cookie Cove','Aurora Snowfields',
 'Santa’s Workshop','Twinkle Star Town','The Grand North Pole'
];

const palettes=[
 ['#d9f3ff','#8bd2f5','#174c75'],
 ['#fff0f4','#ff9dbb','#9b315f'],
 ['#ffe7c9','#c98b5c','#6d432f'],
 ['#e1f6ee','#8bd4b1','#205b50'],
 ['#e7edff','#9db5f7','#354a8a'],
 ['#fce5e5','#e77b7b','#7e303e'],
 ['#e4f7ff','#9ddaf4','#275b84'],
 ['#ffe8f2','#eaa0cf','#8e4779'],
 ['#fff4ce','#e8c56a','#82612d'],
 ['#e0faff','#81d8e9','#24677b'],
 ['#ffefd9','#e8a86e','#845131'],
 ['#e7edff','#a3b6f0','#4c4c8e'],
 ['#fbe7f1','#e9a3c1','#85446c'],
 ['#e7f9ff','#9de4ee','#34718b'],
 ['#fff0d7','#e9bb69','#8c5730']
];

let world=0,level=1;
let steps=0,totalSteps=0,santas=0,presents=0;
let playerName='Player';
let paused=false,complete=false,gameStarted=true;
let cols=13,rows=9,grid=[];
let px=1,py=1,exit={x:11,y:7};
let santaCoins=[],giftItems=[];
let snow=[],sparkles=[];
let cell=50,offsetX=0,offsetY=0;
let sound='Snow',music='Calm winter',soundOn=true,musicOn=false;
let audio=null,musicTimer=null;
let lastMove=0,animation=0;
let levelSeed=1;
let heldDirection=null,heldTimer=0;

function rng(seed){
 let x=Math.sin(seed*127.1+311.7)*43758.5453;
 return x-Math.floor(x);
}
function randInt(n){return Math.floor(Math.random()*n)}

function makeAudio(){
 if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();
 if(audio.state==='suspended')audio.resume();
}
function tone(freq,duration,wave='sine',volume=.07,delay=0){
 if(!soundOn)return;
 try{
  makeAudio();
  const o=audio.createOscillator();
  const g=audio.createGain();
  o.type=wave;
  o.frequency.value=freq;
  g.gain.setValueAtTime(volume,audio.currentTime+delay);
  g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+delay+duration);
  o.connect(g);g.connect(audio.destination);
  o.start(audio.currentTime+delay);
  o.stop(audio.currentTime+delay+duration);
 }catch(e){}
}
function playSound(){
 if(!soundOn)return;
 if(sound==='Snow'){
  tone(880,.13,'sine',.055);
  tone(1175,.15,'sine',.045,.08);
 }else if(sound==='Candy wrappers'){
  tone(550,.07,'triangle',.07);
  tone(740,.08,'triangle',.05,.08);
 }else if(sound==='Hee-hee'){
  // Brighter, louder playful "hee-hee" style sound effect.
  tone(950,.12,'triangle',.22);
  tone(1250,.12,'triangle',.21,.14);
  tone(950,.12,'triangle',.21,.28);
 }else if(sound==='Honey on a keyboard'){
  tone(390,.12,'sine',.075);
  tone(520,.12,'sine',.07,.1);
 }
}
function startMusic(){
 stopMusic();
 if(!musicOn||music==='Off')return;
 try{
  makeAudio();
  musicTimer=setInterval(()=>{
   if(paused||!musicOn)return;
   const notes=music==='Dreamy bells'?[523,659,784,659]:[392,494,587,494];
   tone(notes[randInt(notes.length)],.5,'sine',.025);
  },750);
 }catch(e){}
}
function stopMusic(){
 if(musicTimer){clearInterval(musicTimer);musicTimer=null}
}

function modal(html){
 $('box').innerHTML=html;
 $('modal').style.display='flex';
}
function closeModal(){
 $('modal').style.display='none';
}
function updateHUD(){
 $('world').textContent='🎁 '+worldNames[world];
 $('level').textContent='Level '+level+' / 50';
 $('steps').textContent=steps;
 $('santas').textContent=santas;
 $('playerName').textContent=playerName;
 $('pauseBtn').textContent=paused?'▶ Resume':'Ⅱ Pause';
}

function difficulty(){
 return world*3+Math.floor((level-1)/5);
}
function generateMaze(){
 const d=difficulty();
 cols=Math.min(31,13+Math.floor(d/3)*2);
 rows=Math.min(21,9+Math.floor(d/4)*2);
 if(cols%2===0)cols--;
 if(rows%2===0)rows--;

 grid=Array.from({length:rows},()=>Array(cols).fill(1));
 const stack=[{x:1,y:1}];
 grid[1][1]=0;

 while(stack.length){
  const cur=stack[stack.length-1];
  const dirs=[[0,-2],[2,0],[0,2],[-2,0]];
  for(let i=dirs.length-1;i>0;i--){
   const j=randInt(i+1);
   [dirs[i],dirs[j]]=[dirs[j],dirs[i]];
  }
  let found=false;
  for(const [dx,dy] of dirs){
   const nx=cur.x+dx,ny=cur.y+dy;
   if(nx>0&&ny>0&&nx<cols-1&&ny<rows-1&&grid[ny][nx]===1){
    grid[cur.y+dy/2][cur.x+dx/2]=0;
    grid[ny][nx]=0;
    stack.push({x:nx,y:ny});
    found=true;
    break;
   }
  }
  if(!found)stack.pop();
 }

 // Add a few optional loops in later worlds, while keeping the exit reachable.
 const loops=Math.min(2+Math.floor(d/3),18);
 for(let i=0;i<loops;i++){
  const x=2+randInt(cols-3),y=2+randInt(rows-3);
  if(grid[y][x]===1){
   let open=0;
   if(grid[y-1][x]===0)open++;
   if(grid[y+1][x]===0)open++;
   if(grid[y][x-1]===0)open++;
   if(grid[y][x+1]===0)open++;
   if(open>=2)grid[y][x]=0;
  }
 }

 px=1;py=1;
 exit={x:cols-2,y:rows-2};
 grid[exit.y][exit.x]=0;

 const openCells=[];
 for(let y=1;y<rows-1;y++){
  for(let x=1;x<cols-1;x++){
   if(grid[y][x]===0&&!(x===1&&y===1)&&!(x===exit.x&&y===exit.y)){
    openCells.push({x,y});
   }
  }
 }
 openCells.sort(()=>Math.random()-.5);

 const santaCount=Math.min(3+Math.floor(d/5),8);
 santaCoins=openCells.splice(0,santaCount).map(p=>({...p,wiggle:Math.random()*6}));
 const giftCount=Math.min(1+Math.floor(d/7),4);
 giftItems=openCells.splice(0,giftCount).map(p=>({...p,wiggle:Math.random()*6}));
}

function newLevel(){
 steps=0;
 complete=false;
 levelSeed++;
 generateMaze();
 updateHUD();
}
function nextLevel(){
 if(complete)return;
 complete=true;
 playSound();
 totalSteps+=steps;
 modal(
  '<h2>🎄 MAZE COMPLETE!</h2>'+
  '<p>Great job, '+escapeHTML(playerName)+'!</p>'+
  '<p>You finished '+worldNames[world]+' — Level '+level+'.</p>'+
  '<p>Steps this maze: <b>'+steps+'</b><br>Santa coins collected: <b>'+santas+'</b></p>'+
  '<button id="nextBtn">NEXT LEVEL ➜</button>'
 );
 $('nextBtn').onclick=()=>{
  closeModal();
  if(level<50){level++}
  else if(world<14){world++;level=1;modal(
   '<h2>🌎 NEW WORLD!</h2><p>Welcome to <b>'+worldNames[world]+'</b>!</p><p>Fifty new mazes are waiting for you.</p><button id="worldGo">LET’S GO!</button>'
  );$('worldGo').onclick=()=>{closeModal();newLevel()};return}
  else{
   modal('<h2>🏆 MAZE MASTER!</h2><p>You conquered all 15 Christmas worlds and all 750 levels!</p><p>Total steps: '+totalSteps+'</p><p>Santa coins collected: '+santas+'</p><button id="restartAll">PLAY AGAIN</button>');
   $('restartAll').onclick=()=>{world=0;level=1;steps=0;totalSteps=0;santas=0;presents=0;closeModal();newLevel()};
   return;
  }
  newLevel();
 };
}

function escapeHTML(s){
 return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function settings(){
 paused=true;
 modal(
  '<h2>⚙️ Christmas Settings</h2>'+
  '<div class="field"><label for="nameInput">Your player name (20 characters max)</label>'+
  '<input id="nameInput" maxlength="20" value="'+escapeHTML(playerName)+'" placeholder="Enter your name"></div>'+
  '<div class="field"><label for="soundSelect">Sound effects</label>'+
  '<select id="soundSelect">'+['Snow','Candy wrappers','Hee-hee','Honey on a keyboard'].map(s=>'<option '+(s===sound?'selected':'')+'>'+s+'</option>').join('')+'</select></div>'+
  '<div class="field"><label for="soundToggle">Sound effects</label>'+
  '<select id="soundToggle"><option value="yes" '+(soundOn?'selected':'')+'>On</option><option value="no" '+(!soundOn?'selected':'')+'>Off</option></select></div>'+
  '<div class="field"><label for="musicSelect">Background music</label>'+
  '<select id="musicSelect"><option>Calm winter</option><option>Dreamy bells</option><option>Off</option></select></div>'+
  '<div class="field"><label for="musicToggle">Music</label>'+
  '<select id="musicToggle"><option value="no" '+(!musicOn?'selected':'')+'>Off</option><option value="yes" '+(musicOn?'selected':'')+'>On</option></select></div>'+
  '<p class="small">The Hee-hee sound is turned up. Other sound effects keep their own settings.</p>'+
  '<button id="saveSettings">SAVE SETTINGS</button><button class="secondary" id="cancelSettings">CANCEL</button>'
 );
 $('musicSelect').value=music;
 $('saveSettings').onclick=()=>{
  playerName=$('nameInput').value.slice(0,20).trim()||'Player';
  sound=$('soundSelect').value;
  soundOn=$('soundToggle').value==='yes';
  music=$('musicSelect').value;
  musicOn=$('musicToggle').value==='yes';
  updateHUD();closeModal();paused=false;
  stopMusic();startMusic();
 };
 $('cancelSettings').onclick=()=>{closeModal();paused=false};
}

function fitCanvas(){
 const stage=$('stage');
 const maxW=stage.clientWidth-14;
 const maxH=stage.clientHeight-14;
 const ratio=1000/700;
 let w=maxW,h=w/ratio;
 if(h>maxH){h=maxH;w=h*ratio}
 canvas.style.width=Math.max(1,w)+'px';
 canvas.style.height=Math.max(1,h)+'px';
}
window.addEventListener('resize',fitCanvas);

function getCellSize(){
 cell=Math.min(930/cols,630/rows);
 offsetX=(1000-cols*cell)/2;
 offsetY=(700-rows*cell)/2;
}
function cellCenter(x,y){
 return {x:offsetX+(x+.5)*cell,y:offsetY+(y+.5)*cell};
}
function move(dx,dy){
 if(paused||complete)return;
 const nx=px+dx,ny=py+dy;
 if(nx<0||ny<0||nx>=cols||ny>=rows||grid[ny][nx]!==0)return;
 px=nx;py=ny;steps++;
 playSound();
 const si=santaCoins.findIndex(s=>s.x===px&&s.y===py);
 if(si>=0){
  santaCoins.splice(si,1);santas++;tone(1050,.12,'sine',.08);tone(1320,.16,'sine',.07,.1);
 }
 const gi=giftItems.findIndex(g=>g.x===px&&g.y===py);
 if(gi>=0){
  giftItems.splice(gi,1);presents++;tone(660,.15,'triangle',.08);tone(880,.15,'triangle',.07,.1);
 }
 updateHUD();
 if(px===exit.x&&py===exit.y)nextLevel();
}
function tryDirection(dir){
 const map={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
 if(map[dir])move(...map[dir]);
}
function keyMove(e){
 const map={
  ArrowUp:'up',KeyW:'up',
  ArrowDown:'down',KeyS:'down',
  ArrowLeft:'left',KeyA:'left',
  ArrowRight:'right',KeyD:'right'
 };
 const dir=map[e.code];
 if(dir){
  e.preventDefault();
  if(!e.repeat)tryDirection(dir);
 }
 if(e.code==='Escape'&&$('modal').style.display==='flex'){
  closeModal();paused=false;
 }
}
window.addEventListener('keydown',keyMove);
document.querySelectorAll('#touch button').forEach(b=>{
 b.addEventListener('click',()=>tryDirection(b.dataset.dir));
 b.addEventListener('pointerdown',e=>{e.preventDefault();tryDirection(b.dataset.dir)});
});

function roundedRect(x,y,w,h,r,color){
 ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();
}
function drawSnow(){
 const p=palettes[world];
 ctx.fillStyle=p[0];ctx.fillRect(0,0,1000,700);
 // Soft snowy ground texture
 for(let i=0;i<90;i++){
  const x=(i*137+levelSeed*13)%1000;
  const y=(i*83+levelSeed*19)%700;
  ctx.fillStyle=i%3===0?'#ffffff55':'#ffffff25';
  ctx.beginPath();ctx.arc(x,y,2+(i%4),0,Math.PI*2);ctx.fill();
 }
 // Snow banks at the edges
 ctx.fillStyle='#ffffff50';
 ctx.beginPath();ctx.ellipse(20,340,90,420,0,0,7);ctx.fill();
 ctx.beginPath();ctx.ellipse(980,320,85,430,0,0,7);ctx.fill();
 // Animated snowfall
 for(const s of snow){
  s.y+=s.speed;
  s.x+=Math.sin(s.y*.015)*.4;
  if(s.y>710){s.y=-10;s.x=Math.random()*1000}
  ctx.fillStyle='#ffffffcc';
  ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();
 }
}
function drawDecorations(){
 const p=palettes[world];
 // Festive trees outside the maze area
 for(let i=0;i<10;i++){
  const x=i<5?25+i*16:975-(i-5)*16;
  const y=65+(i%5)*130;
  ctx.fillStyle='#24744e';
  ctx.beginPath();ctx.moveTo(x,y-18);ctx.lineTo(x-12,y+9);ctx.lineTo(x+12,y+9);ctx.closePath();ctx.fill();
  ctx.fillStyle='#ffd66b';ctx.beginPath();ctx.arc(x,y-18,3,0,7);ctx.fill();
 }
 ctx.fillStyle=p[2];ctx.font='bold 19px Fredoka';ctx.textAlign='center';
 ctx.fillText('❄️ '+worldNames[world]+' ❄️',500,27);
}
function drawMaze(){
 getCellSize();
 const p=palettes[world];
 const x0=offsetX,y0=offsetY;
 // Maze background
 roundedRect(x0-5,y0-5,cols*cell+10,rows*cell+10,12,'#d9f2ff');
 for(let y=0;y<rows;y++){
  for(let x=0;x<cols;x++){
   const x1=x0+x*cell,y1=y0+y*cell;
   if(grid[y][x]===1){
    roundedRect(x1+1,y1+1,cell-2,cell-2,Math.max(2,cell*.1),p[2]);
    // Icicle highlight
    ctx.fillStyle='#ffffff40';
    ctx.fillRect(x1+cell*.12,y1+cell*.12,cell*.7,Math.max(2,cell*.06));
   }else{
    ctx.fillStyle='#f4fbff';
    ctx.fillRect(x1,y1,cell,cell);
    if((x+y)%4===0){
     ctx.fillStyle='#d4eefa';
     ctx.fillRect(x1+cell*.42,y1+cell*.42,cell*.12,cell*.12);
    }
   }
  }
 }
 // Santa coins
 for(const s of santaCoins){
  const c=cellCenter(s.x,s.y);
  const bob=Math.sin(animation*4+s.wiggle)*2;
  ctx.font=Math.max(16,cell*.62)+'px Arial';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('🎅',c.x,c.y+bob);
  ctx.textBaseline='alphabetic';
 }
 // Presents
 for(const g of giftItems){
  const c=cellCenter(g.x,g.y);
  const bob=Math.sin(animation*3+g.wiggle)*2;
  ctx.font=Math.max(15,cell*.55)+'px Arial';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('🎁',c.x,c.y+bob);
  ctx.textBaseline='alphabetic';
 }
 // Exit
 const ex=cellCenter(exit.x,exit.y);
 ctx.save();
 ctx.shadowColor='#ffe66d';ctx.shadowBlur=22;
 ctx.font=Math.max(20,cell*.75)+'px Arial';
 ctx.textAlign='center';ctx.textBaseline='middle';
 ctx.fillText('🎄',ex.x,ex.y);
 ctx.restore();
 ctx.textBaseline='alphabetic';
 // Player
 const pc=cellCenter(px,py);
 ctx.save();
 ctx.shadowColor='#238cff';ctx.shadowBlur=16;
 ctx.font=Math.max(18,cell*.72)+'px Arial';
 ctx.textAlign='center';ctx.textBaseline='middle';
 ctx.fillText('🟦',pc.x,pc.y);
 ctx.restore();
 ctx.font=Math.max(12,cell*.38)+'px Arial';
 ctx.textAlign='center';ctx.textBaseline='middle';
 ctx.fillText('🙂',pc.x,pc.y);
 ctx.textBaseline='alphabetic';
}
function draw(){
 animation+=.016;
 drawSnow();drawDecorations();drawMaze();
 ctx.textAlign='left';
 ctx.fillStyle='#164365';
 ctx.font='bold 14px Fredoka';
 ctx.fillText('🎅 Collect the Santa coins!',18,675);
 ctx.textAlign='right';
 ctx.fillText('🎁 Presents: '+presents,980,675);
}

function loop(){
 if(!paused){
  draw();
 }
 requestAnimationFrame(loop);
}

function restartMaze(){
 if(paused)return;
 newLevel();
}
$('settingsBtn').onclick=settings;
$('newBtn').onclick=restartMaze;
$('pauseBtn').onclick=()=>{
 if($('modal').style.display==='flex')return;
 paused=!paused;
 $('pauseBtn').textContent=paused?'▶ Resume':'Ⅱ Pause';
};
$('fullBtn').onclick=()=>{
 if(!document.fullscreenElement){
  document.documentElement.requestFullscreen?.();
 }else{
  document.exitFullscreen?.();
 }
};
$('modal').addEventListener('click',e=>{
 if(e.target===$('modal')&&$('box').innerText.includes('Settings')){
  closeModal();paused=false;
 }
});

function init(){
 for(let i=0;i<95;i++){
  snow.push({x:Math.random()*1000,y:Math.random()*700,r:Math.random()*2.8+1,speed:Math.random()*1.4+.5});
 }
 generateMaze();
 updateHUD();
 fitCanvas();
 requestAnimationFrame(loop);
}
init();
})();
</script>
</body>
</html>
