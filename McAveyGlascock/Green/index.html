
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Speed City - Skateboard Escape</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Fredoka:wght@500;600;700&display=swap');
*{box-sizing:border-box}
body{margin:0;background:#10152b;color:white;font-family:Fredoka,sans-serif;overflow:hidden}
canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated}
#hud{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;pointer-events:none}
.pill{background:#171d38eF;border:2px solid #55e6ed;border-radius:12px;padding:8px 12px;font-weight:700;font-size:15px;box-shadow:0 3px 0 #080c1b}
#buttons{position:fixed;right:12px;top:65px;display:flex;gap:7px}
button{font-family:Fredoka,sans-serif;font-size:16px;font-weight:700;padding:10px 16px;border:0;border-radius:12px;background:#ffcf4a;color:#28203c;cursor:pointer}
button:hover{filter:brightness(1.12)}
#panel{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:#080d20d9}
.card{max-width:510px;width:100%;padding:26px;background:#1c2850;border:3px solid #55e6ed;border-radius:22px;text-align:center;box-shadow:0 12px 45px #0009}
h1{font-family:'Press Start 2P',monospace;color:#ffdf65;font-size:clamp(22px,4vw,36px);line-height:1.5;margin:0 0 12px}
.card p{font-size:18px;line-height:1.5;color:#e1f5ff}
.card .small{font-size:14px;color:#b7d8e8}
.card button{font-size:20px;padding:13px 28px;margin-top:8px}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
 <div class="pill">🌆 <span id="level">Level 1</span></div>
 <div class="pill">🪙 <span id="coins">0</span></div>
 <div class="pill">❤️ <span id="hearts">3</span></div>
 <div class="pill">⭐ <span id="score">0</span></div>
</div>
<div id="buttons"><button id="pause">Ⅱ Pause</button></div>
<div id="panel">
 <div class="card">
  <h1 id="heading">SPEED CITY</h1>
  <p id="message">Grab your skateboard and race through the city! Collect coins, perform tricks, find secret doors, and escape the robots chasing you!</p>
  <p class="small">MOVE: A/D or ←/→<br>JUMP: SPACE or W or ↑<br>TRICK: X while in the air<br>BOOST: SHIFT<br>SECRET DOOR: E when nearby</p>
  <button id="mainButton">START SKATING!</button>
 </div>
</div>
<script>
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);
let W=innerWidth,H=innerHeight,dpr=1;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();

const keys={};
addEventListener('keydown',e=>{
 const k=e.key.toLowerCase();keys[k]=true;
 if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();
 if(k==='p')togglePause();
 if(k==='e')tryDoor();
});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
addEventListener('blur',()=>Object.keys(keys).forEach(k=>keys[k]=false));

const LEVELS=[
 {name:'NEON DOWNTOWN',sky:'#20265a',ground:'#303a62',accent:'#46e6e6'},
 {name:'ROBOT ROW',sky:'#342052',ground:'#49315d',accent:'#ff70c5'},
 {name:'SKYLINE EXPRESS',sky:'#173b61',ground:'#315b79',accent:'#ffe36b'},
 {name:'CYBERPARK',sky:'#164d4b',ground:'#28705e',accent:'#8bff91'},
 {name:'THE FINAL RUN',sky:'#49234d',ground:'#65365c',accent:'#ff9c4a'}
];
const WORLD=2600,GROUND=500;
let level=0,player,robot,platforms,coins,powerups,doors,ramps,obstacles;
let camera=0,score=0,totalCoins=0,lives=3,gameRunning=false,paused=false;
let frame=0,toast='',toastTime=0,levelCoins=0,doorMessage='',doorTimer=0;

function makeLevel(){
 platforms=[];coins=[];powerups=[];doors=[];ramps=[];obstacles=[];
 platforms.push({x:0,y:GROUND,w:WORLD,h:100});
 // Floating rooftops and platforms
 for(let i=0;i<13;i++){
  let x=260+i*175;
  let y=GROUND-(i%3===0?100:i%3===1?65:125);
  platforms.push({x,y,w:105+(i%2)*35,h:18});
 }
 // Ramps, rails and hazards
 for(let i=0;i<10;i++){
  let x=360+i*220;
  ramps.push({x,y:GROUND-8,w:90,h:48});
  if(i%2===0)obstacles.push({x:x+125,y:GROUND-30,w:32,h:30,type:'cone'});
  else obstacles.push({x:x+130,y:GROUND-48,w:36,h:48,type:'barrier'});
 }
 // Coin trails and platform coins
 for(let i=0;i<50;i++){
  let x=180+i*46;
  let y=GROUND-65-(i%5===0?95:i%3===0?45:0);
  coins.push({x,y,got:false,phase:i*.5});
 }
 // Power-ups
 for(let i=0;i<5;i++)powerups.push({x:500+i*390,y:GROUND-100-(i%2)*65,got:false,type:['boost','shield','heart','magnet','mega'][i]});
 // Secret doors, hidden in city scenery
 doors.push({x:830,y:GROUND-55,open:false});
 doors.push({x:1660,y:GROUND-55,open:false});
 // Finish gate
}
function startLevel(){
 makeLevel();
 player={x:95,y:GROUND-60,vx:0,vy:0,w:36,h:48,onGround:false,angle:0,trick:0,boost:0,shield:0,magnet:0,inv:100};
 robot={x:-145,y:GROUND-58};
 camera=0;levelCoins=0;frame=0;
 updateHUD();
}
function updateHUD(){
 $('level').textContent='Level '+(level+1);
 $('coins').textContent=totalCoins;
 $('hearts').textContent=lives;
 $('score').textContent=score;
}
function showPanel(title,msg,button){
 gameRunning=false;paused=false;
 $('heading').textContent=title;$('message').textContent=msg;
 $('mainButton').textContent=button;$('panel').style.display='flex';
 $('pause').textContent='Ⅱ Pause';
}
function startGame(){
 level=0;score=0;totalCoins=0;lives=3;
 startLevel();gameRunning=true;paused=false;
 $('panel').style.display='none';$('pause').textContent='Ⅱ Pause';
 cancelAnimationFrame(raf);last=performance.now();loop();
}
$('mainButton').onclick=()=>{
 if(paused){paused=false;$('panel').style.display='none';$('pause').textContent='Ⅱ Pause';last=performance.now();loop()}
 else startGame();
};
$('pause').onclick=()=>togglePause();
let raf=0,last=0;
function togglePause(){
 if(!gameRunning&&!paused)return;
 if(!paused){paused=true;showPanel('GAME PAUSED','Your board is ready when you are! Take a break, then jump back into the chase.','RESUME')}
 else{paused=false;$('panel').style.display='none';$('pause').textContent='Ⅱ Pause';last=performance.now();loop()}
}
function say(s){toast=s;toastTime=100}
function tryDoor(){
 if(!gameRunning||paused)return;
 const d=doors.find(d=>Math.abs(d.x-player.x)<65&&!d.open);
 if(d){d.open=true;player.x=d.x+90;score+=100;say('SECRET TUNNEL! +100');updateHUD()}
}
function hit(){
 if(player.inv>0)return;
 if(player.shield>0){player.shield=0;say('SHIELD SAVED YOU!');return}
 lives--;player.inv=100;player.vx=-4;player.vy=-7;
 if(lives<=0){updateHUD();showPanel('ROBOT CAUGHT YOU!','The robots caught up! Give it another try and see if you can make it to the end of Speed City.','TRY AGAIN');return}
 say('WATCH OUT!');updateHUD();
}
function nextLevel(){
 if(level>=LEVELS.length-1){
  showPanel('CITY CHAMPION!','You escaped every robot and conquered all five city levels! You are the ultimate Speed City skater!','PLAY AGAIN');return;
 }
 level++;say('LEVEL '+(level+1)+'!');startLevel();
}
function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function update(dt){
 frame++;
 const p=player;
 let left=keys.a||keys.arrowleft,right=keys.d||keys.arrowright;
 let jump=keys[' ']||keys.w||keys.arrowup;
 let target=right?4.5:left?-3.2:0;
 if(p.boost>0)target*=1.35;
 p.vx+=(target-p.vx)*.16;
 p.x+=p.vx;
 p.x=Math.max(0,Math.min(WORLD-p.w,p.x));
 if(jump&&p.onGround){p.vy=-12.2;p.onGround=false;p.trick=0}
 p.vy+=.58;p.vy=Math.min(p.vy,14);
 let oldBottom=p.y+p.h;
 p.y+=p.vy;p.onGround=false;
 // Platform collision: land only when falling onto a platform.
 if(p.vy>=0){
  for(const plat of platforms){
   if(p.x+p.w>plat.x&&p.x<plat.x+plat.w&&oldBottom<=plat.y+5&&p.y+p.h>=plat.y){
    p.y=plat.y-p.h;p.vy=0;p.onGround=true;
   }
  }
 }
 if(p.y>H+300){hit();p.y=GROUND-p.h;p.vy=0}
 // Trick points while airborne
 if(!p.onGround&&keys.x&&p.trick===0){p.trick=1;p.angle+=Math.PI*2;score+=50;say('AWESOME TRICK! +50');updateHUD()}
 if(p.onGround){p.angle=0;p.trick=0}
 // Ramp boost
 for(const r of ramps){
  if(p.x+p.w>r.x&&p.x<r.x+r.w&&p.y+p.h>r.y-10&&p.y+p.h<r.y+20&&p.vx>0){
   p.vy=-10.5;p.vx=Math.max(p.vx,5.2);p.onGround=false;say('RAMP LAUNCH!');
  }
 }
 // Hazards
 for(const o of obstacles)if(overlap(p,o))hit();
 // Collect coins
 for(const c of coins){
  if(c.got)continue;
  let dist=Math.hypot(p.x+p.w/2-c.x,p.y+p.h/2-c.y);
  if(p.magnet>0&&dist<150||dist<28){
   c.got=true;totalCoins++;levelCoins++;score+=10;updateHUD();
  }
 }
 // Powerups
 for(const q of powerups)if(!q.got&&Math.hypot(p.x+18-q.x,p.y+20-q.y)<35){
  q.got=true;
  if(q.type==='boost')p.boost=360;
  if(q.type==='shield')p.shield=600;
  if(q.type==='heart')lives=Math.min(5,lives+1);
  if(q.type==='magnet')p.magnet=500;
  if(q.type==='mega'){score+=200;totalCoins+=5}
  say(q.type.toUpperCase()+' POWER-UP!');updateHUD();
 }
 if(p.boost>0)p.boost--;if(p.shield>0)p.shield--;if(p.magnet>0)p.magnet--;if(p.inv>0)p.inv--;
 // Robot relentlessly follows behind the skater.
 let chaseSpeed=2.0+level*.22;
 robot.x+=Math.max(.7,(p.x-robot.x-105)*.008)+chaseSpeed*.45;
 robot.y=GROUND-57+Math.sin(frame*.07)*5;
 if(robot.x>p.x-35)hit();
 // Camera follows the player
 camera=Math.max(0,Math.min(WORLD-W,p.x-W*.35));
 if(p.x>WORLD-120)nextLevel();
 if(toastTime>0)toastTime--;
}
function pixelRect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(Math.round(x),Math.round(y),w,h)}
function drawBackground(){
 const theme=LEVELS[level];
 ctx.fillStyle=theme.sky;ctx.fillRect(0,0,W,H);
 // stars and skyline
 for(let i=0;i<70;i++){
  let x=((i*137-camera*.12)%(W+30)+W+30)%(W+30),y=(i*67)%Math.max(150,H*.55);
  pixelRect(x,y,3,3,'#d7f4ff');
 }
 for(let i=0;i<16;i++){
  let x=((i*190-camera*.25)%(W+210)+W+210)%(W+210)-80;
  let h=90+(i*47%180),y=GROUND-h;
  pixelRect(x,y,100,h,'#182444');
  for(let wx=x+13;wx<x+90;wx+=22)for(let wy=y+15;wy<GROUND-12;wy+=25){
   if((wx+wy+i)%3!==0)pixelRect(wx,wy,8,10,LEVELS[level].accent);
  }
 }
 // faraway road
 pixelRect(0,GROUND,W,H-GROUND,theme.ground);
 pixelRect(0,GROUND,W,8,theme.accent);
 ctx.fillStyle='#c5d7e5';ctx.globalAlpha=.55;
 for(let x=-(camera%120);x<W;x+=120)ctx.fillRect(x,GROUND+62,55,5);
 ctx.globalAlpha=1;
}
function drawRamp(r){
 ctx.fillStyle='#f4a64e';ctx.beginPath();ctx.moveTo(r.x-camera,GROUND);ctx.lineTo(r.x-camera+r.w,GROUND);ctx.lineTo(r.x-camera+r.w,GROUND-r.h);ctx.closePath();ctx.fill();
 ctx.strokeStyle='#ffe18a';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(r.x-camera,GROUND);ctx.lineTo(r.x-camera+r.w,GROUND-r.h);ctx.stroke();
}
function drawSkater(){
 const p=player,x=p.x-camera,y=p.y;
 ctx.save();ctx.translate(x+18,y+24);ctx.rotate(p.angle);
 if(p.inv>0&&Math.floor(p.inv/7)%2===0)ctx.globalAlpha=.45;
 // skateboard
 pixelRect(-24,19,48,6,'#ffca48');pixelRect(-18,25,7,4,'#1b233e');pixelRect(12,25,7,4,'#1b233e');
 // legs
 pixelRect(-9,9,7,12,'#253b70');pixelRect(5,8,7,13,'#253b70');
 // hoodie body
 pixelRect(-12,-9,25,20,'#ff5d83');pixelRect(-8,-14,17,7,'#ff91a8');
 // head and hair
 pixelRect(-8,-27,17,15,'#efbd8e');pixelRect(-10,-31,20,7,'#39274a');
 pixelRect(-8,-16,16,4,'#fff');
 pixelRect(3,-22,3,3,'#20203a');
 // helmet
 pixelRect(-11,-33,23,5,'#46e6e6');pixelRect(-7,-37,15,5,'#46e6e6');
 if(p.shield>0){ctx.strokeStyle='#79f7ff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,37,0,Math.PI*2);ctx.stroke()}
 ctx.restore();
}
function drawRobot(){
 const x=robot.x-camera,y=robot.y;
 ctx.save();ctx.translate(x,y);
 pixelRect(-22,-37,44,37,'#8993a8');pixelRect(-16,-48,32,14,'#aeb8ca');
 pixelRect(-13,-42,7,6,'#ff3e6c');pixelRect(6,-42,7,6,'#ff3e6c');
 pixelRect(-27,-29,7,17,'#68748c');pixelRect(20,-29,7,17,'#68748c');
 pixelRect(-14,0,8,12,'#56627b');pixelRect(7,0,8,12,'#56627b');
 pixelRect(-7,-25,14,7,'#ff5e74');
 ctx.restore();
}
function draw(){
 drawBackground();
 ctx.save();ctx.translate(-camera,0);
 // platforms
 for(const p of platforms){
  if(p.y>=GROUND)continue;
  pixelRect(p.x,p.y,p.w,p.h,'#596e9b');
  pixelRect(p.x,p.y,p.w,5,'#b4d8f2');
  pixelRect(p.x+8,p.y+7,p.w-16,4,'#34456d');
 }
 for(const r of ramps)drawRamp(r);
 for(const o of obstacles){
  pixelRect(o.x,o.y,o.w,o.h,o.type==='cone'?'#ff9c47':'#ec5b78');
  pixelRect(o.x+5,o.y+7,o.w-10,5,'#ffe08a');
 }
 for(const d of doors){
  pixelRect(d.x,d.y,44,55,d.open?'#38d8b4':'#242e58');
  pixelRect(d.x+6,d.y+7,32,42,d.open?'#79ffdb':'#a45ce0');
  pixelRect(d.x+31,d.y+26,4,4,'#ffdc6c');
  if(!d.open){ctx.fillStyle='#fff';ctx.font='12px Fredoka';ctx.fillText('?',d.x+17,d.y-7)}
 }
 for(const c of coins)if(!c.got){
  ctx.fillStyle='#ffda50';ctx.beginPath();ctx.arc(c.x,c.y+Math.sin(frame*.08+c.phase)*3,9,0,Math.PI*2);ctx.fill();
  pixelRect(c.x-2,c.y-5,4,10,'#fff2a8');
 }
 for(const q of powerups)if(!q.got){
  const colors={boost:'#ff9c47',shield:'#55e6ed',heart:'#ff6585',magnet:'#d28bff',mega:'#ffe36b'};
  pixelRect(q.x-12,q.y-12,24,24,colors[q.type]);
  ctx.fillStyle='#17203d';ctx.font='bold 15px Fredoka';ctx.textAlign='center';
  ctx.fillText(({boost:'B',shield:'S',heart:'+',magnet:'M',mega:'★'})[q.type],q.x,q.y+5);
 }
 ctx.restore();
 drawRobot();drawSkater();
 // Level name
 ctx.fillStyle='#fff';ctx.font='bold 17px Fredoka';ctx.textAlign='center';
 ctx.fillText(LEVELS[level].name,W/2, H-18);
 if(toastTime>0){
  ctx.fillStyle='#10172cdd';ctx.fillRect(W/2-155,95,310,43);
  ctx.fillStyle='#ffe36b';ctx.font='bold 19px Fredoka';ctx.textAlign='center';ctx.fillText(toast,W/2,123);
 }
}
function loop(now){
 if(!gameRunning||paused)return;
 let dt=Math.min(2,(now-last)/16.67||1);last=now;
 // update uses frame-based physics; clamp large frame gaps
 update(dt);
 if(!gameRunning)return;
 draw();
 raf=requestAnimationFrame(loop);
}
makeLevel();startLevel();
})();
</script>
</body>
</html>
